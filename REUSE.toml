version = 1
SPDX-PackageName = "dossier"
SPDX-PackageSupplier = "Quaternion Media <peter.kagstrom@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/quaternionmedia/dossier"

# Licensing is declared here rather than as per-file SPDX headers. Most of the
# annotatable surface is Python and Markdown whose opening lines are already
# load-bearing (module docstrings, a document's H1), and the two governance
# pointer files are symlinks, which cannot carry a header at all -- writing one
# writes into the target. See the outbound-licensing record's section 12 in
# governance/qm/records/.
#
# Paths are matched by the last block that matches, so the blocks below win
# over the default at the top.

# --- This project's own code and prose --------------------------------------
# The copyright line reproduces what LICENSE and pyproject.toml assert today.
# It names an individual, while the outbound-licensing record's section 0
# places copyright in Quaternion Media -- that gap is conflict C1 in this
# project's adoption record, and it is a human's decision rather than
# something this file settles by declaring a different string.
#
# The MIT identifier is likewise what the repository already declares. Which
# outbound class this project actually falls into is the adoption record's
# open `Pends on`, so this block records the current state rather than
# ratifying it.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 Peter Kagstrom"
SPDX-License-Identifier = "MIT"

# --- Copy-forward governance prose from the seed (outbound section 2) -------
# AGENTS.md is project-seed/ide/AGENTS.md with this project's own sections
# appended; CLAUDE.md and .github/copilot-instructions.md are symlinks to it
# and follow their target's licence rather than their directory's.
[[annotations]]
path = [
  "AGENTS.md",
  "CLAUDE.md",
  ".github/copilot-instructions.md",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 Quaternion Media"
SPDX-License-Identifier = "CC0-1.0"

# --- Executable and machine-read seed files (outbound section 3) ------------
# Copied verbatim from project-seed/ci/ and project-seed/ide/.vscode/. CC0
# grants no patent licence and is not fit for executable content, which is why
# these differ from the block above.
[[annotations]]
path = [
  ".github/workflows/adr-lint.yml",
  ".github/workflows/submodule-check.yml",
  ".github/workflows/reuse-lint.yml",
  ".vscode/settings.json",
  ".vscode/extensions.json",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 Quaternion Media"
SPDX-License-Identifier = "Apache-2.0"

# --- A vendored typeface, so a generated picture is the same everywhere ------
# `docs/fonts/` carries DejaVu Sans Mono because `dossier.filmstrip` draws the
# narrative GIFs with it. Rendering with whatever monospace face the generating
# machine happens to have would make the committed artifact depend on who ran
# it -- a Linux CI run and a Windows one would differ visibly, and the diff
# would be noise nobody can read.
#
# Not this project's copyright and not this project's licence. The fonts are
# Bitstream's under the Bitstream Vera licence, with DejaVu's own changes in
# the public domain and imported Arev glyphs copyright Tavmjong Bah; the full
# text travels beside them as `LICENSE_DEJAVU`. `LicenseRef-DejaVu` names that
# file rather than claiming an SPDX identifier the licence does not have.
[[annotations]]
path = [
  "docs/fonts/DejaVuSansMono.ttf",
  "docs/fonts/DejaVuSansMono-Bold.ttf",
  "docs/fonts/LICENSE_DEJAVU",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2003 Bitstream, Inc.; DejaVu changes are in the public domain; Arev glyphs (c) Tavmjong Bah"
SPDX-License-Identifier = "LicenseRef-DejaVu"
